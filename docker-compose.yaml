version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EFIBANK_CLIENT_ID=${EFIBANK_CLIENT_ID}
      - EFIBANK_CLIENT_SECRET=${EFIBANK_CLIENT_SECRET}
      - EFIBANK_SANDBOX=${EFIBANK_SANDBOX}
      - EFIBANK_PIX_KEY=${EFIBANK_PIX_KEY}
      - EFIBANK_CERT_PATH=${EFIBANK_CERT_PATH}
      - STARTPAINEL_URL=${STARTPAINEL_URL}
      - STARTPAINEL_ADMIN_USER=${STARTPAINEL_ADMIN_USER}
      - STARTPAINEL_ADMIN_PASS=${STARTPAINEL_ADMIN_PASS}
    restart: always
